name: macOS Build and Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xs-template-check:
    name: XS template syntax and API check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned XS Check release
        run: |
          curl --fail --location --retry 3 https://github.com/Divy1211/xs-check/releases/download/v0.2.32/xs-check --output xs-check
          echo '93deca6c96503124ec349e70b4b3042d99a9ad562aaa97125f0cdb9db7789f3f  xs-check' | sha256sum --check
          chmod +x xs-check

      - name: Assemble runtime and food observer
        run: node Scripts/assemble-xs-template.mjs

      - name: Validate runtime template before the macOS build finishes
        run: ./xs-check .build/ci/trainer-runtime.xs

  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Unit tests
        env:
          AOE2_TRAINER_XS_OUTPUT: ${{ github.workspace }}/.build/generated/trainer_catalog.xs
        run: swift test

      - name: Upload generated XS catalog for static validation
        uses: actions/upload-artifact@v4
        with:
          name: Generated-XS-catalog
          path: .build/generated/trainer_catalog.xs
          if-no-files-found: error

      - name: Build macOS application
        run: bash Scripts/build-app.sh

      - name: Archive application
        run: ditto -c -k --sequesterRsrc --keepParent .build/AoE2MacTrainer.app AoE2MacTrainer-macos.zip

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: AoE2MacTrainer-macos
          path: AoE2MacTrainer-macos.zip

  xs-check:
    name: Generated XS syntax and type check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download generated catalog
        uses: actions/download-artifact@v4
        with:
          name: Generated-XS-catalog
          path: generated

      - name: Download pinned XS Check release
        run: |
          curl --fail --location --retry 3 https://github.com/Divy1211/xs-check/releases/download/v0.2.32/xs-check --output xs-check
          echo '93deca6c96503124ec349e70b4b3042d99a9ad562aaa97125f0cdb9db7789f3f  xs-check' | sha256sum --check
          chmod +x xs-check

      - name: Validate generated XS
        run: ./xs-check generated/trainer_catalog.xs

  release:
    name: Publish requested v0.6.0 release
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release: publish v0.6.0')
    needs: [build, xs-template-check, xs-check]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout verified source and release notes
        uses: actions/checkout@v4

      - name: Download validated application
        uses: actions/download-artifact@v4
        with:
          name: AoE2MacTrainer-macos
          path: .build/release-inputs/app

      - name: Download validated XS catalog
        uses: actions/download-artifact@v4
        with:
          name: Generated-XS-catalog
          path: .build/release-inputs/xs

      - name: Package, verify and publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: 0.6.0
        run: node Scripts/publish-release.mjs
